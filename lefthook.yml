pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,css,md,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}

    - name: related unit tests
      glob: "*.{js,jsx,ts,tsx}"
      run: node scripts/lefthook-related-tests.mjs {staged_files}

    - name: code-review-graph
      run: |
        if command -v code-review-graph >/dev/null 2>&1; then
          code-review-graph update || true
          code-review-graph detect-changes --brief || true
        fi
