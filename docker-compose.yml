# Stack de dev local — simule la prod (Postgres + API Hono + Web Vite).
# `docker compose up` suffit : db monte → migrate installe deps + migre →
# api démarre → web démarre (proxy /api → api).
#
# ⚠️ Dev local uniquement. En prod : web → Cloudflare Pages, api → Worker,
# base → Neon (voir DEPLOY.md). Cloudflare gratuit n'héberge ni Docker ni Postgres.

name: ensemble

# node_modules en volumes nommés (masquent ceux de l'hôte montés via bind) :
# installés une fois par `migrate`, partagés par api/web → pas de réinstall, pas
# de purge pnpm liée au store hôte.
x-node-modules: &node_modules
  - .:/app
  - node_modules_root:/app/node_modules
  - node_modules_web:/app/apps/web/node_modules
  - node_modules_api:/app/apps/api/node_modules
  - node_modules_db:/app/packages/db/node_modules
  - pnpm_store:/root/.local/share/pnpm/store

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ensemble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ensemble}
      POSTGRES_DB: ${POSTGRES_DB:-ensemble}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ensemble} -d ${POSTGRES_DB:-ensemble}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot : installe les dépendances (premier run) et applique les migrations
  # Drizzle. Sort en 0 ; api/web attendent sa réussite. Lancer `make seed` pour le contenu de démo.
  migrate:
    build: { context: ., dockerfile: Dockerfile.dev }
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ensemble:ensemble@db:5432/ensemble}
      DB_DRIVER: node
      CI: "true"
    volumes: *node_modules
    working_dir: /app
    command: >
      sh -c "pnpm install &&
             pnpm --filter @ensemble/db migrate"

  # Intercepteur SMTP pour le dev local. UI web : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  api:
    build: { context: ., dockerfile: Dockerfile.dev }
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ensemble:ensemble@db:5432/ensemble}
      DB_DRIVER: node
      API_PORT: ${API_PORT:-8787}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me-please-32chars-min}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-Ensemble <noreply@ensemble.local>}
    ports:
      - "${API_PORT:-8787}:8787"
    volumes: *node_modules
    working_dir: /app
    command: pnpm --filter @ensemble/api dev

  web:
    build: { context: ., dockerfile: Dockerfile.dev }
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_PROXY: ${VITE_API_PROXY:-http://api:8787}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes: *node_modules
    working_dir: /app
    command: pnpm --filter @ensemble/web dev --host 0.0.0.0 --port 5173

volumes:
  pgdata:
  pnpm_store:
  node_modules_root:
  node_modules_web:
  node_modules_api:
  node_modules_db:
