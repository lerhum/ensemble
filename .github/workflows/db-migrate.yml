name: DB Migrate (Neon)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also run the demo seed after migrating"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @ensemble/db migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed demo content
        if: ${{ inputs.seed }}
        run: pnpm --filter @ensemble/db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
